[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tenderza"
version = "0.1.0"
description = "South African Tender Discovery & Intelligence Platform (Blueprint v2, Phase 0/1 skeleton)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "httpx>=0.27",
    "psycopg[binary]>=3.1",
    "psycopg-pool>=3.2",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pymupdf>=1.24",
    "email-validator>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "pgserver>=0.1.4",  # embedded Postgres w/ pgvector for local integration tests
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection idiom uses calls in argument defaults.
"src/tenderza/api/app.py" = ["B008", "E402"]
"src/tenderza/api/review.py" = ["B008"]
"src/tenderza/api/alerts.py" = ["B008"]
"src/tenderza/api/health_dashboard.py" = ["B008"]
